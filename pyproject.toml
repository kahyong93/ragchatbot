[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
    "openai>=2.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# backend/tests is on the path too: tests/__init__.py makes `tests` a package,
# so `from conftest import ...` in test modules needs the dir importable itself.
pythonpath = ["backend", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "api: tests that exercise the FastAPI endpoints",
    "unit: isolated component tests",
    "integration: tests that touch real ChromaDB or the network",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
